name: Deploy
on:
  push:
    # "**" also matches branches with a slash, such as dependabot/npm_and_yarn/...
    # so the checks below run on every Dependabot pull request.
    branches:
      - "**"
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build --if-present
        working-directory: app
        env:
          # react-scripts turns ESLint warnings into build errors when CI=true.
          # The build must only fail on real compile errors.
          CI: "false"

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: SetupNode
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
        working-directory: app
      - name: Prettier
        run: npx prettier --check .
        working-directory: app

  golint:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: SetupGo
        uses: actions/setup-go@v7
        with:
          go-version-file: go-backend/api/go.mod
          cache-dependency-path: go-backend/api/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go-backend/api
